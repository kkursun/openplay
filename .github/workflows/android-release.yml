name: Android release

# Builds the Android app and publishes its APKs as a GitHub release, three ways: run this workflow from the
# Actions tab with a version (it makes the tag and the release), publish a release on GitHub (its APKs get
# attached), or push a tag like v1.1. Versions with a dash, like 1.1-beta, are pre-releases.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, like 1.1 or 1.1-beta
        required: true
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      OPENPLAY_VERSION: ${{ inputs.version && format('v{0}', inputs.version) || github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Android 17 SDK, and ffmpeg for the tests that check the muxer's output
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg > /dev/null
      - name: Signing key from the repository's secrets, if it has one
        env:
          KEYSTORE: ${{ secrets.OPENPLAY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/openplay.p12"
            echo "OPENPLAY_KEYSTORE=$RUNNER_TEMP/openplay.p12" >> "$GITHUB_ENV"
          fi
      - name: Test and build
        env:
          OPENPLAY_KEY_PASSWORD: ${{ secrets.OPENPLAY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.OPENPLAY_VERSION }}
        run: |
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi=${apk##*/app-}
            cp "$apk" "openplay-$TAG-${abi%-release.apk}.apk"
          done
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" openplay-*.apk --clobber
            exit
          fi
          cat > notes.md <<NOTES
          The openplay Android app, for Android 10 and later: play to the TV from the phone itself, or use the
          phone as a remote for openplay on a PC (see [android/README.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/android/README.md)).

          Download the APK for your phone's processor and open it (allow installing apps from your browser or
          file manager when asked):

          - **arm64-v8a**: nearly every phone from the last several years
          - **armeabi-v7a**: older 32-bit phones
          - **x86_64**: emulators and Chromebooks
          - **universal**: any of them, if unsure (bigger)
          NOTES
          gh release create "$TAG" openplay-*.apk --target "$GITHUB_SHA" --title "openplay $TAG" \
            --notes-file notes.md $([[ "$TAG" == *-* ]] && echo --prerelease)
